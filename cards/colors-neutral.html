<!-- @dsCard group="Colors" viewport="700x150" name="Neutral · Slate" subtitle="본문·배경·보더용 중립 슬레이트" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:20px 24px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid rgba(0,0,0,.06); }
  .lbl { font-size:11px; color:var(--text-muted); margin-top:6px; font-family:var(--font-mono); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><div class="lbl">900</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-800)"></div><div class="lbl">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="lbl">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="lbl">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="lbl">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="lbl">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-300)"></div><div class="lbl">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="lbl">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="lbl">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="lbl">50</div></div>
  </div>
</body></html>
