<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing · 4px 스케일" subtitle="여백·간격 토큰 (4px 베이스)" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:22px 26px; }
  .row { display:flex; align-items:flex-end; gap:16px; }
  .item { text-align:center; }
  .bar { background:var(--navy-200); border-radius:3px; width:100%; }
  .b { display:inline-block; background:var(--accent); border-radius:2px; }
  .lbl { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-top:8px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><span class="b" style="width:4px;height:4px"></span><div class="lbl">1·4</div></div>
    <div class="item"><span class="b" style="width:8px;height:8px"></span><div class="lbl">2·8</div></div>
    <div class="item"><span class="b" style="width:12px;height:12px"></span><div class="lbl">3·12</div></div>
    <div class="item"><span class="b" style="width:16px;height:16px"></span><div class="lbl">4·16</div></div>
    <div class="item"><span class="b" style="width:24px;height:24px"></span><div class="lbl">6·24</div></div>
    <div class="item"><span class="b" style="width:32px;height:32px"></span><div class="lbl">8·32</div></div>
    <div class="item"><span class="b" style="width:48px;height:48px"></span><div class="lbl">12·48</div></div>
    <div class="item"><span class="b" style="width:64px;height:64px"></span><div class="lbl">16·64</div></div>
  </div>
</body></html>
