<!-- @dsCard group="Colors" viewport="700x150" name="Primary · SNU Navy" subtitle="브랜드 앵커 네이비 스케일" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:20px 24px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid rgba(0,0,0,.06); }
  .lbl { font-size:11px; color:var(--text-muted); margin-top:6px; font-family:var(--font-mono); }
  .hex { font-size:11px; color:var(--text-faint); font-family:var(--font-mono); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="lbl">900</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-800)"></div><div class="lbl">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="lbl">700 ★</div><div class="hex">#003876</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-600)"></div><div class="lbl">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-500)"></div><div class="lbl">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-400)"></div><div class="lbl">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-300)"></div><div class="lbl">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-200)"></div><div class="lbl">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-100)"></div><div class="lbl">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-50)"></div><div class="lbl">50</div></div>
  </div>
</body></html>
