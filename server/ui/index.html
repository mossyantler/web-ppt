<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주간 리포트 편집기</title>

<!-- 탭 아이콘. 파일 하나를 더 두지 않고 문서 안에 그린다 — 이것 하나 때문에 서버에
     정적 경로를 늘리기는 아깝고, 없으면 브라우저가 매번 404 를 콘솔에 남긴다.
     16:9 판 하나에 글줄 두 개, 곧 슬라이드다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='5' width='20' height='14' rx='2' fill='%233b82f6'/%3E%3Crect x='5' y='9' width='11' height='2' rx='1' fill='white'/%3E%3Crect x='5' y='13' width='7' height='2' rx='1' fill='white' opacity='.7'/%3E%3C/svg%3E">

<link rel="stylesheet" href="/app.css">

<!-- 수식 미리보기용. 슬라이드 안에도 KaTeX 가 있지만 그건 iframe 안이고, 미리보기는
     편집기 쪽(부모 문서)에 그려야 입력칸 바로 아래에 붙는다 (결정 8). 같은 파일을
     두 문서가 각자 받는다 — 저장소 공용 자산이라 서버가 이미 내주고 있다. -->
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<script defer src="/assets/katex/katex.min.js"></script>
</head>
<body>

<!-- 화면 둘을 한 문서에 담고 주소(#)로 갈아 끼운다. 페이지를 새로 받지 않으므로
     리포트를 오갈 때 iframe 만 다시 뜨고 편집기 껍데기는 그대로 산다. -->

<section id="view-decks" class="view">
  <div class="pad">
    <h1>주간 리포트 편집기</h1>
    <p class="hint">리포트를 고르거나 새로 만드세요.</p>
    <button type="button" id="new-deck">＋ 새 리포트</button>
    <ul id="deck-list" aria-busy="true"></ul>
  </div>
</section>

<!-- 새 리포트 설정 = 프레젠테이션 마스터 (명세 결정 3).
     내용 슬라이드를 고르는 화면이 아니다 — 틀을 먼저 잡고 시작한다. -->
<section id="view-setup" class="view" hidden>
  <div class="pad">
    <h1>새 리포트</h1>
    <p class="hint">틀을 먼저 정합니다. 나중에 편집기에서 다 바꿀 수 있습니다.</p>

    <form id="setup-form">
      <fieldset>
        <legend>머리글 · 꼬리글</legend>
        <label>랩 이름 <input name="lab" placeholder="Flow Physics & Informatics Lab"></label>
        <label>소속 <input name="department" placeholder="건설환경도시공학부"></label>
        <label>주차 <input name="week" placeholder="2026 · W32"></label>
        <label>날짜 <input name="date" type="date"></label>
        <label>발표자 <input name="presenter" placeholder="장민엽"></label>
      </fieldset>

      <fieldset>
        <legend>표지</legend>
        <label>제목 <input name="title" placeholder="2026 W32 주간 보고"></label>
        <label>부제 <input name="subtitle" placeholder="지난주 요약 · 진행 상황 · 다음 계획"></label>
      </fieldset>

      <fieldset>
        <legend>디자인</legend>
        <label>메인 색 <input name="mainColor" type="color" value="#003876"></label>
        <label>서브 색 <input name="subColor" type="color" value="#0f766e"></label>
        <label>본문 글자 크기 <input name="bodySize" type="number" min="14" max="32" value="19"></label>
        <label>배경
          <select name="bg">
            <option value="light">밝은 바탕</option>
            <option value="dark">어두운 바탕</option>
          </select>
        </label>
      </fieldset>

      <div class="setup-actions">
        <button type="submit" id="setup-make">만들기</button>
        <a class="back" href="#/">취소</a>
      </div>
      <p id="setup-error"></p>
    </form>
  </div>
</section>

<section id="view-editor" class="view" hidden>
  <!-- 제목줄. 어느 리포트를 열고 있는지와, 화면을 통째로 바꾸는 것 둘만 산다.
       리본과 나누는 이유 — 이 줄은 **바뀌지 않는다.** 탭을 옮겨도 리포트 이름과 발표는
       제자리에 있어야 하고, 그 항상성이 곧 "여기가 어디인지" 를 말해 준다. -->
  <header id="topbar">
    <a class="back" href="#/" title="리포트 목록으로">목록</a>

    <span class="tb-title">
      <span id="deck-name"></span>
      <span id="deck-sub"></span>
    </span>

    <span class="tb-fill"></span>

    <span class="tb-group">
      <button type="button" id="pane-toggle" title="서식 창 열고 닫기" aria-pressed="false">서식</button>
    </span>

    <!-- 발표 (결정 9). 오른쪽 끝에 홀로 둔다 — 화면을 통째로 바꾸는 유일한 버튼이라
         편집 도구와 섞이면 안 된다. 탭을 옮겨도 여기 남는 이유도 그것이다. -->
    <button type="button" id="present" class="tb-primary" title="전체화면으로 발표 (Esc 로 나감)">발표</button>
  </header>

  <!-- 리본 (파워포인트식). **예전에는 만들지 않기로 했던 것이다** — 그때 적어 둔 이유가
       "명령이 여섯 개뿐이라 탭을 만들면 빈 자리만 넓어진다" 였고, 그 판단은 그때 맞았다.
       지금 서버에 등록된 명령은 스물셋이고 화면이 부르는 것만 열댓이다. 한 줄에 늘어놓으면
       창이 좁을 때 밀려 나가 사라지고, 무엇이 무엇의 짝인지도 안 보인다.

       탭은 넷이다. 다섯째("보기") 를 만들지 않은 것은 넣을 것이 배율뿐인데 그것은 이미
       상태줄 오른쪽에 있기 때문이다 — 자리를 채우려고 탭을 만들지 않는다. -->
  <nav id="tabs" role="tablist" aria-label="리본 탭">
    <button type="button" role="tab" data-tab="home" aria-selected="true">홈</button>
    <button type="button" role="tab" data-tab="insert" aria-selected="false">삽입</button>
    <button type="button" role="tab" data-tab="design" aria-selected="false">디자인</button>
    <button type="button" role="tab" data-tab="arrange" aria-selected="false">배치</button>
  </nav>

  <!-- 리본 본체. 묶음마다 아래에 이름이 붙는다 — 파워포인트가 그렇게 하는 이유는
       아이콘만으로는 "이 넷이 한 벌" 이라는 사실을 말할 수 없어서다. -->
  <div id="ribbon">

    <div class="rb-panel" data-tab="home" role="tabpanel">
      <!-- 되돌리기·다시하기 (M3 결정 5). 꺼진 버튼이 "여기가 끝" 을 말한다. -->
      <div class="rb-group">
        <div class="rb-items">
          <button type="button" class="rb-big" id="undo" title="되돌리기 (Ctrl+Z)" disabled>되돌리기</button>
          <button type="button" class="rb-big" id="redo" title="다시하기 (Ctrl+Shift+Z)" disabled>다시하기</button>
        </div>
        <div class="rb-name">실행</div>
      </div>

      <!-- 장 조작. 레일에도 같은 넷이 있지만 거기서는 **마우스를 올린 그 장**에 걸리고
           여기서는 **지금 보고 있는 장**에 걸린다. 둘은 다른 물음이라 둘 다 있어야 한다. -->
      <div class="rb-group">
        <div class="rb-items">
          <button type="button" id="slide-up" title="이 장을 위로">위로</button>
          <button type="button" id="slide-down" title="이 장을 아래로">아래로</button>
          <button type="button" id="slide-dup" title="이 장을 복제">복제</button>
          <button type="button" id="slide-del" title="이 장을 지우기 (되돌리기로 돌아옵니다)">지우기</button>
        </div>
        <div class="rb-name">슬라이드</div>
      </div>

      <!-- 고른 요소에 걸리는 것들. 아무것도 안 골랐으면 넷 다 꺼진다 —
           회색 버튼이 "먼저 무언가를 고르라" 는 말을 대신한다. -->
      <div class="rb-group" data-needs="element">
        <div class="rb-items">
          <button type="button" id="el-up" title="위로 옮기기">위로</button>
          <button type="button" id="el-down" title="아래로 옮기기">아래로</button>
          <button type="button" id="el-dup" title="복제 (Ctrl+D)">복제</button>
          <button type="button" id="el-del" title="지우기 (되돌리기로 돌아옵니다)">지우기</button>
        </div>
        <div class="rb-name">고른 요소</div>
      </div>
    </div>

    <div class="rb-panel" data-tab="insert" role="tabpanel" hidden>
      <!-- 넣을 수 있는 종류는 **테마 매핑**이 정한다(`GET /vocabulary`). 화면이 목록을
           들고 있으면 테마를 갈았을 때 목록에는 있는데 넣으면 422 인 항목이 생긴다.

           내용과 상자를 나눠 담는 이유 — 스물일곱 개를 한 덩어리로 늘어놓으면 "글을
           넣겠다" 와 "칸을 만들겠다" 가 섞여 눈이 목록을 두 번 훑어야 한다. 고르기
           메뉴(`select.js`)도 같은 둘로 나눈다. -->
      <div class="rb-group rb-fill rb-fill-wide" data-needs="insert">
        <div class="rb-items rb-wrap" id="insert-leaf"></div>
        <div class="rb-name">내용 넣기</div>
      </div>

      <div class="rb-group rb-fill" data-needs="insert">
        <div class="rb-items rb-wrap" id="insert-box"></div>
        <div class="rb-name">상자 넣기</div>
      </div>

      <div class="rb-group">
        <div class="rb-items">
          <label class="rb-big" id="pic-pick" title="그림 파일을 골라 넣습니다">
            그림
            <input type="file" id="pic-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
          </label>
          <label class="rb-big" id="logo-pick" title="모든 장의 머리에 로고를 넣습니다">
            로고
            <input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp" hidden>
          </label>
        </div>
        <div class="rb-name">그림</div>
      </div>
    </div>

    <div class="rb-panel" data-tab="design" role="tabpanel" hidden>
      <!-- 배경 (결정 4·9). 이 장만 바꾸는 것이 기본이고, 전체 적용이 탈출구다. -->
      <div class="rb-group" id="bg-pick">
        <div class="rb-items">
          <button type="button" id="bg-light" aria-pressed="true" title="이 장을 밝은 바탕으로">밝게</button>
          <button type="button" id="bg-dark" aria-pressed="false" title="이 장을 어두운 바탕으로">어둡게</button>
          <button type="button" id="bg-all" title="지금 배경을 모든 장에 적용">모든 장에</button>
        </div>
        <div class="rb-name">이 장의 배경</div>
      </div>

      <div class="rb-group">
        <div class="rb-items">
          <button type="button" class="rb-big" id="theme" title="색·글자 크기 — 모든 장이 함께 바뀝니다" aria-pressed="false">테마</button>
        </div>
        <div class="rb-name">리포트 전체</div>
      </div>
    </div>

    <div class="rb-panel" data-tab="arrange" role="tabpanel" hidden>
      <div class="rb-group" data-needs="element">
        <div class="rb-items">
          <button type="button" class="rb-big" id="el-free" title="자유 배치 — 아무 데나 끌어다 놓기">자유 배치</button>
        </div>
        <div class="rb-name">놓는 방식</div>
      </div>

      <div class="rb-group" data-needs="element">
        <div class="rb-items">
          <button type="button" id="el-wrap" title="상자 안에 넣기">묶기</button>
          <button type="button" id="el-unwrap" title="상자를 벗기고 안의 것을 꺼내기">풀기</button>
        </div>
        <div class="rb-name">묶음</div>
      </div>
    </div>
  </div>

  <div id="editor-body">
    <nav id="rail" aria-label="슬라이드 목록"></nav>
    <div id="canvas">
      <!-- 슬라이드 원본을 그대로 띄운다. 편집기 CSS 와 덱 테마가 한 문서에서 섞이면
           테마를 갈았을 때 편집기가 같이 깨지므로, 경계를 iframe 으로 못 박는다. -->
      <iframe id="stage" title="슬라이드"></iframe>

      <!-- 선택 테두리와 이름표가 그려지는 층. iframe **위**에 겹친다 —
           슬라이드 DOM 에 표시를 넣지 않겠다는 약속이 이 한 겹으로 지켜진다.
           클릭은 이 층을 그대로 통과해 슬라이드로 간다 (pointer-events: none). -->
      <div id="overlay" aria-hidden="true"></div>

      <!-- 이름표가 없어 아직 고칠 수 없는 장을 덮는 막 (결정 9). 잠그기만 하고 방법을
           안 주면 나갈 문이 없으므로 "고치기" 버튼이 여기 붙는다. -->
      <div id="lock" hidden></div>

      <!-- 고치기 뒤에 남은, 자동으로 판단이 안 된 자리들. 실패가 아니라 할 일 목록이다. -->
      <div id="findings" hidden></div>
    </div>

    <!-- 서식 칸 (파워포인트의 "도형 서식"). 리본이 **무엇을 할지**를 고르는 자리라면
         여기는 **얼마나**를 정하는 자리다 — 색을 3 도 어둡게 하는 일은 버튼 하나로
         표현할 수 없다. 슬라이드를 덮지 않고 옆에 서는 것이 이 자리의 값이다. -->
    <aside id="inspector" class="pane" aria-label="서식" hidden></aside>
  </div>

  <!-- 상태줄. 저장 결과와 배율이 여기 산다.
       윗줄에서 내려온 이유 — 저 셋은 **읽는 것**이고 윗줄은 **누르는 것**이다. 섞여 있으면
       글자가 늘어날 때마다 버튼이 옆으로 밀린다. 배율을 오른쪽 끝에 두는 것은 파워포인트와
       같다(사진 우하단). 자주 쓰지만 급하지 않은 것의 자리다.

       알림·선택·덱 상태는 자리를 따로 쓴다 — 한 자리에 두면 화면을 다시 받을 때
       선택 표시가 사유를 덮어써서 왜 실패했는지 사라진다. -->
  <footer id="statusbar">
    <span id="deck-state"></span>
    <span id="sel-state"></span>
    <span id="notice"></span>

    <span class="sb-fill"></span>

    <span id="zoom">
      <button type="button" id="zoom-out" title="축소">축소</button>
      <button type="button" id="zoom-val" title="100% 로 (원래 크기)">100%</button>
      <button type="button" id="zoom-in" title="확대">확대</button>
      <span class="tb-div"></span>
      <button type="button" id="zoom-fit" title="창에 맞추기" aria-pressed="true">맞춤</button>
    </span>
  </footer>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
